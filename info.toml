Deferred calls run last in, first out. The usual way to get the right order is to defer the clean-up right after the line that needs it: open the file, defer closing it, then open the connection, defer closing that.

For more information: https://go.dev/tour/flowcontrol/13"""

[[exercises]]
name = "defer3"
